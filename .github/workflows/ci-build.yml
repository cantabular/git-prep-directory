name: CI
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build and run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: |
          make build

      - name: Run
        run: |
          ./git-prep-directory --url https://github.com/sensiblecodeio/git-prep-directory -ref main
